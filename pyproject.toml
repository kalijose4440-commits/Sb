[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[project]
name = "disnake-fastapi-bot"
version = "0.1.0"
description = "Scaffold for a modular Disnake bot with FastAPI dashboard and PostgreSQL persistence"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "disnake>=2.10.1",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy[asyncio]>=2.0.31",
  "asyncpg>=0.29.0",
  "pydantic-settings>=2.3.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.7",
  "httpx>=0.27.0",
  "aiosqlite>=0.20.0",
  "ruff>=0.5.7",
  "mypy>=1.11.1",
]

[project.scripts]
discord-bot = "bot.bot:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_optional = true
check_untyped_defs = true
exclude = [
  "^tests/",
]
